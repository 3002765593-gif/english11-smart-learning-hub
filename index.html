function switchZone(z){zone=z;page='home';document.getElementById('studentTab').classList.toggle('active',z==='student');document.getElementById('teacherTab').classList.toggle('active',z==='teacher');render()};function go(p,l){page=p;if(l)lesson=l;qi=0;selected=null;checked=false;answers={};render();window.scrollTo(0,0)};function badge(s){return `<span class="pill">${s}</span>`};function card(title,body,action=''){return `<div class="card"><h3>${title}</h3><div class="muted small">${body}</div>${action?`<p>${action}</p>`:''}</div>`}
function render(){if(zone==='teacher')return renderTeacher();if(page==='home'){const attempts=db.results.length;app.innerHTML=`<div class="hero">${badge('UNIT 01 • GLOBAL SUCCESS')}<h1>A Long and Healthy Life 🌿</h1><p>Ôn tập, luyện tập, chơi game và kiểm tra theo bài học. Chào ${esc(db.name)}!</p><div class="row"><button class="btn" onclick="go('units')">Bắt đầu học Unit 1 →</button><button class="btn secondary" onclick="go('results')">Kết quả của tôi</button></div></div><div class="grid">${card('📚 Learn','Lý thuyết, ví dụ, kiến thức theo Lesson',`<button class="btn secondary" onclick="go('units')">Xem bài học</button>`)}${card('✍️ Practise','Bài tập có phản hồi và giải thích',`<button class="btn secondary" onclick="go('practice')">Luyện tập</button>`)}${card('🎮 Play','Grammar Race – trò chơi củng cố',`<button class="btn secondary" onclick="go('game')">Chơi ngay</button>`)}${card('📝 Test Center','Hai bài Test mẫu Unit 1',`<button class="btn secondary" onclick="go('tests')">Xem bài Test</button>`)}</div><h2 class="section">Tiến độ của bạn</h2><div class="grid">${card('Lượt đã hoàn thành',`<span class="stat">${attempts}</span>`)}${card('Điểm trung bình',`<span class="stat">${attempts?(db.results.reduce((s,r)=>s+r.score,0)/attempts).toFixed(1):'—'}</span> / 10`)}${card('Bài giáo viên giao',`<span class="stat">${db.assignments.length}</span>`)}</div><p class="notice small">Bản demo dùng câu hỏi biên soạn mẫu và lưu dữ liệu trên thiết bị hiện tại. Không dùng điểm demo làm minh chứng thực nghiệm chính thức.</p>`;return}

if(page==='learn'){let content=lesson==='grammar'?`<h3>Past Simple</h3><p><b>Cấu trúc:</b> S + V2/ed. Dùng cho hành động đã kết thúc tại thời điểm xác định trong quá khứ.</p><p><b>Dấu hiệu:</b> yesterday, last week, in 2023, ago.</p><p><i>She went jogging yesterday.</i></p><h3>Present Perfect</h3><p><b>Cấu trúc:</b> S + have/has + V3/ed. Dùng cho trải nghiệm hoặc sự việc liên quan đến hiện tại.</p><p><b>Dấu hiệu thường gặp:</b> ever, never, already, yet, since, for.</p><p><i>I have exercised regularly for two months.</i></p><p class="notice small">Lưu ý: các dấu hiệu là gợi ý, cần xét ngữ cảnh trước khi chọn thì.</p>`:lesson==='vocabulary'?`<h3>Health & Fitness</h3><p><b>balanced diet</b> – chế độ ăn cân bằng</p><p><b>fitness</b> – thể lực</p><p><b>exercise regularly</b> – tập thể dục thường xuyên</p><p><b>healthy habit</b> – thói quen lành mạnh</p><p><b>symptom</b> – triệu chứng</p>`:lesson==='pronunciation'?`<h3>Strong and weak forms of auxiliary verbs</h3><p>Trợ động từ thường được phát âm dạng yếu khi không được nhấn mạnh; dạng mạnh có thể xuất hiện khi nhấn mạnh, phủ định hoặc ở cuối câu trả lời ngắn.</p><p><i>Yes, I HAVE.</i> (nhấn mạnh)</p><p class="notice small">Audio mẫu chưa được tích hợp ở phiên bản này.</p>`:`<h3>${lessons.find(x=>x[0]===lesson)?.[1]||'Lesson'}</h3><p>Khung bài học đã sẵn sàng. Nội dung chi tiết, audio và nhiệm vụ thực hành của phần này đang được biên soạn và kiểm duyệt.</p>`;app.innerHTML=`<div class="row between"><h1>${lessons.find(x=>x[0]===lesson)?.[1]}</h1><button class="btn secondary" onclick="go('units')">← Learning Path</button></div><div class="card">${badge('LEARN')}${content}<button class="btn" onclick="go('practice')">Luyện tập →</button></div>`;return}

function renderPractice(){let q=questions[qi];app.innerHTML=`<div class="row between"><h1>✍️ Practise</h1><button class="btn secondary" onclick="go('home')">← Trang chủ</button></div><div class="card">${badge(q.topic)} <span class="muted small">Câu ${qi+1}/${questions.length}</span><h2>${esc(q.q)}</h2><div class="options">${q.o.map((o,i)=>`<button class="option ${selected===i?'selected':''} ${checked&&i===q.a?'good':''} ${checked&&selected===i&&i!==q.a?'bad':''}" onclick="choose(${i})" ${checked?'disabled':''}>${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div>${checked?`<div class="feedback"><b>${selected===q.a?'✓ Chính xác!':'✗ Chưa đúng.'}</b> ${esc(q.e)}</div>`:''}<div class="row"><button class="btn" onclick="${checked?'nextPractice()':'checkPractice()'}" ${selected===null?'disabled':''}>${checked?(qi===questions.length-1?'Hoàn thành':'Câu tiếp theo →'):'Kiểm tra đáp án'}</button></div></div>`};function choose(i){if(!checked){selected=i;renderPractice()}}function checkPractice(){if(selected===null)return;answers[qi]=selected;checked=true;renderPractice()}function nextPractice(){if(qi<questions.length-1){qi++;selected=null;checked=false;renderPractice()}else{let correct=questions.filter((q,i)=>answers[i]===q.a).length;record('Practise Unit 1',correct/questions.length*10);alert(`Hoàn thành: ${correct}/${questions.length} câu đúng`);go('results')}}
function renderGame(){let seq=[2,4,7,0,1];if(gameIndex>=seq.length){record('Grammar Race',gameScore/seq.length*10);let s=gameScore;gameIndex=0;gameScore=0;app.innerHTML=`<div class="hero"><h1>🏆 Hoàn thành thử thách!</h1><h2>${s}/${seq.length} câu đúng</h2><button class="btn" onclick="go('home')">Về trang chủ</button> <button class="btn secondary" onclick="go('game')">Chơi lại</button></div>`;return}let q=questions[seq[gameIndex]];app.innerHTML=`<div class="row between"><h1>🎮 Grammar Race</h1><button class="btn secondary" onclick="go('home')">Thoát</button></div><div class="card">${badge(`Vòng ${gameIndex+1}/5`)}<h2>${esc(q.q)}</h2><div class="options">${q.o.map((o,i)=>`<button class="option" onclick="gameAnswer(${i})">${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div><p class="muted small">Mỗi đáp án đúng được 1 điểm. Đây là game luyện tập mẫu.</p></div>`};function gameAnswer(i){let seq=[2,4,7,0,1],q=questions[seq[gameIndex]];if(i===q.a)gameScore++;gameIndex++;renderGame()}
function renderTests(){app.innerHTML=`<div class="row between"><h1>📝 Unit 1 – Test Center</h1><button class="btn secondary" onclick="go('home')">← Trang chủ</button></div><p class="notice">Hai đề bên dưới là <b>bản mẫu 6 câu/đề</b> để kiểm thử quy trình. Mục tiêu chính thức: 40 câu/50 phút theo định hướng thi tốt nghiệp THPT từ năm 2025; cần biên soạn và kiểm duyệt bổ sung.</p><div class="grid">${[1,2].map(i=>card(`Unit 1 – Test 0${i}`,'6 câu mẫu • chấm điểm tự động • có giải thích sau khi nộp',`<button class="btn" onclick="startTest(${i})">Bắt đầu Test ${i}</button>`)).join('')}</div>`};function startTest(id){testId=id;answers={};testStart=Date.now();page='taking';render()};function renderTaking(){let ids=tests[testId];app.innerHTML=`<div class="row between"><h1>Unit 1 – Test 0${testId}</h1><span class="pill">${Object.keys(answers).length}/${ids.length} câu đã chọn</span></div><div class="card"><p class="muted">Bản mẫu: không giới hạn thời gian. Đề chính thức sẽ áp dụng 50 phút.</p>${ids.map((id,j)=>{let q=questions[id];return `<div style="border-top:1px solid #e5e9f3;padding:14px 0"><b>Câu ${j+1}.</b> ${esc(q.q)}<div class="options">${q.o.map((o,k)=>`<button class="option ${answers[j]===k?'selected':''}" onclick="testAnswer(${j},${k})">${'ABCD'[k]}. ${esc(o)}</button>`).join('')}</div></div>`}).join('')}<button class="btn" onclick="submitTest()">Nộp bài</button></div>`};function testAnswer(j,k){answers[j]=k;renderTaking()};function submitTest(){let ids=tests[testId],correct=ids.filter((id,j)=>answers[j]===questions[id].a).length,score=correct/ids.length*10;record('Unit 1 – Test 0'+testId,score);app.innerHTML=`<div class="hero"><h1>🎉 Đã nộp bài!</h1><div class="stat">${score.toFixed(1)}/10</div><p>Đúng ${correct}/${ids.length} câu • ${Math.max(1,Math.round((Date.now()-testStart)/1000))} giây</p><button class="btn" onclick="go('results')">Xem lịch sử</button> <button class="btn secondary" onclick="go('tests')">Test Center</button></div><h2>Giải thích đáp án</h2>${ids.map((id,j)=>card(`Câu ${j+1}: ${questions[id].q}`,`Đáp án: ${'ABCD'[questions[id].a]}. ${questions[id].o[questions[id].a]}<br>${questions[id].e}`)).join('')}`};function record(type,score){db.results.push({type,score:Math.round(score*10)/10,date:new Date().toLocaleString('vi-VN')});save()}
function renderTeacher(){let results=db.results;app.innerHTML=`<div class="hero"><h1>👩‍🏫 Teacher Studio</h1><p>Không gian quản lý bản mẫu • Sử dụng dữ liệu trên cùng trình duyệt</p></div><div class="grid">${card('Lượt hoàn thành',`<span class="stat">${results.length}</span>`)}${card('Điểm trung bình',`<span class="stat">${results.length?(results.reduce((s,r)=>s+r.score,0)/results.length).toFixed(1):'—'}</span>/10`)}${card('Bài đã giao',`<span class="stat">${db.assignments.length}</span>`)}</div><h2 class="section">Giao bài cho học sinh demo</h2><div class="card"><label>Tên bài giao</label><input id="assignName" value="Unit 1 – Test 01"><label>Chọn bài</label><select id="assignTest"><option value="1">Test 01</option><option value="2">Test 02</option></select><label>Hạn nộp</label><input type="date" id="assignDate"><p><button class="btn" onclick="addAssignment()">+ Giao bài</button></p><p class="muted small">Trong bản mẫu, bài giao chỉ xuất hiện trên cùng thiết bị/trình duyệt. Chức năng lớp học nhiều tài khoản sẽ cần cơ sở dữ liệu và đăng nhập.</p></div><h2 class="section">Kết quả làm bài</h2><div class="card">${results.length?`<table><tr><th>Hoạt động</th><th>Điểm</th><th>Ngày</th></tr>${results.slice().reverse().map(r=>`<tr><td>${esc(r.type)}</td><td>${r.score}/10</td><td>${esc(r.date)}</td></tr>`).join('')}</table>`:'Chưa có dữ liệu.'}<p><button class="btn secondary" onclick="exportCsv()">⬇ Xuất CSV</button></p></div><h2 class="section">Danh sách bài đã giao</h2><div class="card">${db.assignments.length?db.assignments.map(a=>`<p>📝 ${esc(a.name)} – Test ${a.test} – hạn ${esc(a.deadline||'chưa đặt')}</p>`).join(''):'Chưa có bài giao.'}</div>`};function addAssignment(){let name=document.getElementById('assignName').value.trim(),test=+document.getElementById('assignTest').value,deadline=document.getElementById('assignDate').value;if(!name)return alert('Vui lòng nhập tên bài.');db.assignments.push({name,test,deadline});save();renderTeacher()};function exportCsv(){let rows=[['Hoạt động','Điểm / 10','Ngày'],...db.results.map(r=>[r.type,r.score,r.date])],csv='\ufeff'+rows.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='English11_Results_Demo.csv';a.click();URL.revokeObjectURL(a.href)}render();
</script></body></html>
