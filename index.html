
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English 11 Smart Learning Hub</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6ff;color:#26345a}
header{background:linear-gradient(110deg,#293d93,#6751b8);color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
header h1{margin:0;font-size:25px}
header p{margin:7px 0 0;font-size:13px}
nav{display:flex;gap:10px}
button{cursor:pointer;font:inherit}
nav button{background:#ffffff20;border:1px solid #ffffff60;color:white;padding:12px 17px;border-radius:13px}
nav button.active{background:white;color:#34479a}
main{max-width:1100px;margin:28px auto;padding:0 18px;min-height:65vh}
.hero{background:linear-gradient(110deg,#e0eaff,#eee4ff);border-radius:20px;padding:28px;margin-bottom:22px}
.hero h2{font-size:29px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:white;border:1px solid #e0e5f2;border-radius:17px;padding:21px;margin-bottom:15px;box-shadow:0 4px 15px #2233660b}
.card h3{margin-top:0}
.btn{background:#3753b7;border:0;color:white;border-radius:10px;padding:11px 17px;margin:5px 5px 5px 0;font-weight:bold}
.btn.alt{background:#e9edff;color:#344a9a}
.btn:disabled{opacity:.5;cursor:not-allowed}
.muted{color:#66738f}
.pill{display:inline-block;background:#e5eaff;color:#344da2;padding:6px 11px;border-radius:20px;font-size:12px;font-weight:bold}
.option{display:block;width:100%;text-align:left;background:white;border:1px solid #d9e0f2;border-radius:10px;padding:13px;margin:9px 0;color:#25345c}
.option.selected{background:#e5ecff;border:2px solid #4263cf}
.option.correct{background:#e3f8eb;border-color:#28a06a}
.option.wrong{background:#ffebee;border-color:#e25b69}
.feedback{background:#edf5ff;padding:15px;border-radius:10px;margin:15px 0}
input,select{padding:12px;border:1px solid #d2daee;border-radius:10px;width:100%;margin:7px 0 14px}
label{font-weight:bold}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid #e2e7f3;padding:12px;text-align:left}
.notice{background:#fff7e6;border-left:4px solid #edb74e;padding:13px;border-radius:7px}
footer{text-align:center;color:#77829b;padding:30px;font-size:12px}
@media(max-width:600px){header h1{font-size:20px}.hero h2{font-size:23px}}
</style>
</head>
<body>

<header>
<div>
<h1>🎓 English 11 Smart Learning Hub</h1>
<p>Global Success • Learn · Practise · Play · Test · Improve</p>
</div>
<nav>
<button id="studentTab" class="active" onclick="switchZone('student')">🎒 Student Zone</button>
<button id="teacherTab" onclick="switchZone('teacher')">👩‍🏫 Teacher Studio</button>
</nav>
</header>

<section id="studentLogin" style="max-width:500px;margin:24px auto;padding:24px;background:white;border-radius:16px;box-shadow:0 4px 16px #0001;">
  <h2>🔐 Đăng nhập học sinh</h2>
  <p>Nhập tài khoản và mật khẩu do giáo viên cấp.</p>

  <input id="loginEmail" type="email"
    placeholder="Email học sinh"
    autocomplete="username"
    style="width:100%;padding:12px;margin:8px 0;box-sizing:border-box;">

  <input id="loginPassword" type="password"
    placeholder="Mật khẩu"
    autocomplete="current-password"
    style="width:100%;padding:12px;margin:8px 0;box-sizing:border-box;">

  <button type="button" onclick="submitStudentLogin()">
    Đăng nhập
  </button>

  <p id="loginStatus" role="status"></p>
</section>
<main id="app"></main>

<footer>
Bản mẫu học tập năm học 2026–2027 • Dữ liệu lưu trên trình duyệt
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";

const SUPABASE_URL = "https://fkharblzowborvywjpbx.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_1T2JLpwTueTdNjbeUpZH4w_TbwfCOx5";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);
const STORAGE_KEY="english11_hub_demo_v2";

async function loginStudent(email, password) {
  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: password
  });

  if (error) {
    alert("Đăng nhập thất bại: " + error.message);
    return;
  }

  const { data: profile, error: profileError } = await supabaseClient
    .from("student_profiles")
    .select("student_code, class_id")
    .eq("user_id", data.user.id)
    .single();

  if (profileError || !profile) {
    alert("Đăng nhập thành công nhưng chưa tìm thấy hồ sơ học sinh.");
    return;
  }

  alert("Đăng nhập thành công! Mã học sinh: " + profile.student_code);
}
document.getElementById("studentLogin").style.display = "none";
document.getElementById("loginPassword").value = "";
document.getElementById("app").scrollIntoView({ behavior: "smooth" });
async function submitStudentLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const status = document.getElementById("loginStatus");

  if (!email || !password) {
    status.textContent = "Vui lòng nhập đủ email và mật khẩu.";
    return;
  }

  status.textContent = "Đang đăng nhập...";

  try {
    await loginStudent(email, password);
    status.textContent = "Đã xử lý yêu cầu. Xem thông báo đăng nhập.";
  } catch (error) {
    status.textContent = "Có lỗi: " + error.message;
  }
}
function loadData(){
  try{
    const old=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
    if(old && Array.isArray(old.results) && Array.isArray(old.assignments)){
      return old;
    }
  }catch(e){
    console.warn("Không đọc được dữ liệu cũ",e);
  }
  return {results:[],assignments:[]};
}

let db=loadData();
let zone="student";
let page="home";
let lesson="getting";
let questionIndex=0;
let selected=null;
let checked=false;
let practiceAnswers={};
let gameIndex=0;
let gameScore=0;
let currentTest=1;
let testAnswers={};
let testStarted=0;

const app=document.getElementById("app");

function save(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
  }catch(e){
    console.warn("Không lưu được dữ liệu",e);
  }
}

function safe(value){
  return String(value??"").replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}

function record(type,score){
  db.results.push({
    type:type,
    score:Math.round(score*10)/10,
    date:new Date().toLocaleString("vi-VN")
  });
  save();
}

const units=[
"A Long and Healthy Life",
"The Generation Gap",
"Cities of the Future",
"ASEAN and Viet Nam",
"Global Warming",
"Preserving Our Heritage",
"Education Options for School-Leavers",
"Becoming Independent",
"Social Issues",
"The Ecosystem"
];

const lessons=[
["getting","Getting Started","Healthy habits and conversation"],
["pronunciation","Pronunciation","Strong and weak forms"],
["vocabulary","Vocabulary","Health and fitness"],
["grammar","Grammar","Past Simple vs Present Perfect"],
["reading","Reading","A healthy lifestyle"],
["speaking","Speaking","Talking about healthy habits"],
["listening","Listening","Food and health"],
["writing","Writing","Writing about healthy habits"],
["communication","Communication & Culture","Everyday communication"],
["looking","Looking Back & Project","Review and project"]
];

const questions=[
{
q:"I ____ this book three times.",
o:["read","have read","am reading","was reading"],
a:1,
e:"Present perfect diễn tả trải nghiệm đến hiện tại."
},
{
q:"She ____ to the gym yesterday.",
o:["has gone","goes","went","has been"],
a:2,
e:"Yesterday là thời điểm quá khứ xác định, dùng past simple."
},
{
q:"Which word means being physically strong and healthy?",
o:["fitness","disease","stress","symptom"],
a:0,
e:"Fitness nghĩa là thể lực, tình trạng khỏe mạnh."
},
{
q:"We ____ our grandparents since last summer.",
o:["didn't visit","haven't visited","don't visit","weren't visiting"],
a:1,
e:"Since last summer thường đi với present perfect trong ngữ cảnh này."
},
{
q:"A balanced ____ includes different kinds of healthy food.",
o:["habit","diet","fever","virus"],
a:1,
e:"Balanced diet nghĩa là chế độ ăn cân bằng."
},
{
q:"My brother ____ a marathon in 2023.",
o:["has run","runs","ran","is running"],
a:2,
e:"In 2023 là mốc quá khứ xác định, dùng past simple."
},
{
q:"Mai walks for 30 minutes every day. Which habit is mentioned?",
o:["Skipping breakfast","Daily walking","Sleeping late","Drinking soda"],
a:1,
e:"Mai có thói quen đi bộ mỗi ngày."
},
{
q:"You should ____ regularly to stay healthy.",
o:["exercise","illness","medicine","symptom"],
a:0,
e:"Exercise regularly nghĩa là tập thể dục thường xuyên."
}
];

function card(title,description,button=""){
  return `<div class="card"><h3>${title}</h3>
  <p class="muted">${description}</p>${button}</div>`;
}

function switchZone(z){
  zone=z;
  page="home";
  document.getElementById("studentTab").classList.toggle("active",z==="student");
  document.getElementById("teacherTab").classList.toggle("active",z==="teacher");
  render();
}

function go(p,l){
  page=p;
  if(l)lesson=l;
  questionIndex=0;
  selected=null;
  checked=false;
  practiceAnswers={};
  if(p==="game"){gameIndex=0;gameScore=0;}
  render();
  window.scrollTo(0,0);
}

function render(){
  if(zone==="teacher"){
    renderTeacher();
    return;
  }

  if(page==="home"){
    const count=db.results.length;
    const average=count?
      (db.results.reduce((s,r)=>s+r.score,0)/count).toFixed(1):"—";

    app.innerHTML=`
    <div class="hero">
      <span class="pill">ENGLISH 11 • GLOBAL SUCCESS</span>
      <h2>Welcome to English 11 Smart Learning Hub 🌿</h2>
      <p>Học tập, luyện tập, chơi trò chơi và kiểm tra kiến thức.</p>
      <button class="btn" onclick="go('units')">📚 Khám phá bài học</button>
      <button class="btn alt" onclick="go('results')">📊 Kết quả của tôi</button>
    </div>
    <div class="grid">
      ${card("📚 Learn","Học theo Unit và Lesson",
      `<button class="btn" onclick="go('units')">Bắt đầu học</button>`)}
      ${card("✍️ Practise","Bài tập có đáp án và giải thích",
      `<button class="btn" onclick="go('practice')">Luyện tập</button>`)}
      ${card("🎮 Play","Trò chơi Grammar Race",
      `<button class="btn" onclick="go('game')">Chơi ngay</button>`)}
      ${card("📝 Test Center","Hai bài kiểm tra mẫu Unit 1",
      `<button class="btn" onclick="go('tests')">Làm bài</button>`)}
    </div>
    <h2>📊 Tiến độ học tập</h2>
    <div class="grid">
      ${card("Lượt hoàn thành",`<h2>${count}</h2>`)}
      ${card("Điểm trung bình",`<h2>${average}/10</h2>`)}
      ${card("Bài được giao",`<h2>${db.assignments.length}</h2>`)}
    </div>
    <p class="notice">Đây là phiên bản demo. Chức năng đồng bộ nhiều tài khoản sẽ được bổ sung sau.</p>`;
    return;
  }

  if(page==="units"){
    app.innerHTML=`
    <h2>📚 Danh sách 10 Units</h2>
    <button class="btn alt" onclick="go('home')">← Trang chủ</button>
    <div class="grid">
    ${units.map((u,i)=>card(
      `Unit ${i+1}`,
      safe(u),
      i===0?
      `<button class="btn" onclick="go('lessons')">Mở Unit 1</button>`:
      `<button class="btn alt" disabled>Đang biên soạn</button>`
    )).join("")}
    </div>`;
    return;
  }

  if(page==="lessons"){
    app.innerHTML=`
    <h2>Unit 1 – A Long and Healthy Life</h2>
    <button class="btn alt" onclick="go('units')">← Danh sách Units</button>
    <div class="grid">
    ${lessons.map(x=>card(
      safe(x[1]),safe(x[2]),
      `<button class="btn" onclick="go('learn','${x[0]}')">Mở bài học</button>`
    )).join("")}
    </div>`;
    return;
  }

  if(page==="learn"){
    renderLesson();
    return;
  }

  if(page==="practice"){
    renderPractice();
    return;
  }

  if(page==="game"){
    renderGame();
    return;
  }

  if(page==="tests"){
    renderTests();
    return;
  }

  if(page==="taking"){
    renderTaking();
    return;
  }

  if(page==="results"){
    renderResults();
    return;
  }
}

function renderLesson(){
  let content="";
  if(lesson==="grammar"){
    content=`
    <h3>Past Simple</h3>
    <p><b>Form:</b> S + V2/ed</p>
    <p>Dùng cho hành động đã kết thúc tại thời điểm xác định trong quá khứ.</p>
    <p><b>Example:</b> She went jogging yesterday.</p>
    <h3>Present Perfect</h3>
    <p><b>Form:</b> S + have/has + V3/ed</p>
    <p>Dùng để nói về trải nghiệm hoặc sự việc liên quan đến hiện tại.</p>
    <p><b>Example:</b> I have exercised regularly for two months.</p>
    <p><b>Remember:</b> Cần dựa vào ngữ cảnh để chọn thì phù hợp.</p>`;
  }else if(lesson==="vocabulary"){
    content=`
    <h3>Health and Fitness</h3>
    <p><b>balanced diet:</b> chế độ ăn cân bằng</p>
    <p><b>fitness:</b> thể lực</p>
    <p><b>healthy habit:</b> thói quen lành mạnh</p>
    <p><b>exercise regularly:</b> tập thể dục thường xuyên</p>
    <p><b>symptom:</b> triệu chứng</p>`;
  }else if(lesson==="pronunciation"){
    content=`
    <h3>Strong and Weak Forms</h3>
    <p>Trợ động từ có thể được phát âm ở dạng mạnh hoặc dạng yếu.</p>
    <p>Dạng mạnh thường xuất hiện khi cần nhấn mạnh hoặc trong câu trả lời ngắn.</p>
    <p><b>Example:</b> Yes, I HAVE.</p>
    <p class="notice">Audio đang được biên soạn.</p>`;
  }else{
    content=`
    <h3>Nội dung bài học</h3>
    <p>Phần này đang được biên soạn và kiểm duyệt theo sách Global Success.</p>
    <p>Bạn có thể luyện tập Unit 1 ngay trong phiên bản demo.</p>`;
  }

  const item=lessons.find(x=>x[0]===lesson);
  app.innerHTML=`
  <h2>${safe(item?item[1]:"Lesson")}</h2>
  <button class="btn alt" onclick="go('lessons')">← Learning Path</button>
  <div class="card">
  <span class="pill">LEARN</span>
  ${content}
  <button class="btn" onclick="go('practice')">Luyện tập →</button>
  </div>`;
}

function renderPractice(){
  const q=questions[questionIndex];
  app.innerHTML=`
  <h2>✍️ Practise – Unit 1</h2>
  <button class="btn alt" onclick="go('home')">← Trang chủ</button>
  <div class="card">
  <span class="pill">Câu ${questionIndex+1}/${questions.length}</span>
  <h3>${safe(q.q)}</h3>
  ${q.o.map((o,i)=>`
    <button class="option
    ${selected===i?"selected":""}
    ${checked&&i===q.a?"correct":""}
    ${checked&&selected===i&&i!==q.a?"wrong":""}"
    onclick="choose(${i})" ${checked?"disabled":""}>
    ${"ABCD"[i]}. ${safe(o)}
    </button>`).join("")}
  ${checked?`<div class="feedback">
    <b>${selected===q.a?"✓ Chính xác!":"✗ Chưa đúng."}</b>
    <p>${safe(q.e)}</p>
    </div>`:""}
  <button class="btn" onclick="${checked?"nextPractice()":"checkPractice()"}"
    ${selected===null?"disabled":""}>
    ${checked?"Câu tiếp theo →":"Kiểm tra đáp án"}
  </button>
  </div>`;
}

function choose(i){
  if(!checked){
    selected=i;
    renderPractice();
  }
}

function checkPractice(){
  if(selected===null)return;
  practiceAnswers[questionIndex]=selected;
  checked=true;
  renderPractice();
}

function nextPractice(){
  if(questionIndex<questions.length-1){
    questionIndex++;
    selected=null;
    checked=false;
    renderPractice();
  }else{
    const correct=questions.filter((q,i)=>practiceAnswers[i]===q.a).length;
    record("Practise Unit 1",correct/questions.length*10);
    alert(`Hoàn thành: ${correct}/${questions.length} câu đúng!`);
    go("results");
  }
}

function renderGame(){
  const sequence=[2,4,7,0,1];

  if(gameIndex>=sequence.length){
    const score=gameScore;
    record("Grammar Race",score/sequence.length*10);
    app.innerHTML=`
    <div class="hero">
      <h2>🏆 Hoàn thành Grammar Race!</h2>
      <h3>Đúng ${score}/${sequence.length} câu</h3>
      <button class="btn" onclick="go('game')">Chơi lại</button>
      <button class="btn alt" onclick="go('home')">Trang chủ</button>
    </div>`;
    gameIndex=0;
    gameScore=0;
    return;
  }

  const q=questions[sequence[gameIndex]];
  app.innerHTML=`
  <h2>🎮 Grammar Race</h2>
  <button class="btn alt" onclick="go('home')">← Thoát</button>
  <div class="card">
    <span class="pill">Vòng ${gameIndex+1}/${sequence.length}</span>
    <h3>${safe(q.q)}</h3>
    ${q.o.map((o,i)=>`
      <button class="option" onclick="gameAnswer(${i})">
      ${"ABCD"[i]}. ${safe(o)}</button>
    `).join("")}
  </div>`;
}

function gameAnswer(i){
  const sequence=[2,4,7,0,1];
  const q=questions[sequence[gameIndex]];
  if(i===q.a)gameScore++;
  gameIndex++;
  renderGame();
}

const testSets={
  1:[0,1,2,3,4,5],
  2:[5,4,3,2,1,0]
};

function renderTests(){
  app.innerHTML=`
  <h2>📝 Unit 1 – Test Center</h2>
  <button class="btn alt" onclick="go('home')">← Trang chủ</button>
  <p class="notice">Hai đề dưới đây là bản mẫu 6 câu/đề.
  Hệ thống đề chính thức 40 câu/50 phút sẽ được phát triển sau.</p>
  <div class="grid">
    ${[1,2].map(i=>card(
      `Unit 1 – Test 0${i}`,
      "6 câu trắc nghiệm • Chấm điểm tự động",
      `<button class="btn" onclick="startTest(${i})">Bắt đầu</button>`
    )).join("")}
  </div>`;
}

function startTest(id){
  currentTest=id;
  testAnswers={};
  testStarted=Date.now();
  page="taking";
  render();
}

function renderTaking(){
  const ids=testSets[currentTest];
  app.innerHTML=`
  <h2>📝 Unit 1 – Test 0${currentTest}</h2>
  <p class="notice">Bài kiểm tra mẫu, chưa giới hạn thời gian.</p>
  <div class="card">
    ${ids.map((id,j)=>{
      const q=questions[id];
      return `<div style="padding:14px 0;border-bottom:1px solid #e1e5f2">
        <b>Câu ${j+1}. ${safe(q.q)}</b>
        ${q.o.map((o,k)=>`
          <button class="option ${testAnswers[j]===k?"selected":""}"
          onclick="testAnswer(${j},${k})">
          ${"ABCD"[k]}. ${safe(o)}
          </button>`).join("")}
      </div>`;
    }).join("")}
    <button class="btn" onclick="submitTest()">Nộp bài</button>
  </div>`;
}

function testAnswer(j,k){
  testAnswers[j]=k;
  renderTaking();
}

function submitTest(){
  const ids=testSets[currentTest];
  const correct=ids.filter((id,j)=>testAnswers[j]===questions[id].a).length;
  const score=correct/ids.length*10;
  record(`Unit 1 – Test 0${currentTest}`,score);

  app.innerHTML=`
  <div class="hero">
    <h2>🎉 Đã nộp bài!</h2>
    <h2>${score.toFixed(1)}/10</h2>
    <p>Đúng ${correct}/${ids.length} câu.</p>
    <button class="btn" onclick="go('results')">Xem kết quả</button>
    <button class="btn alt" onclick="go('tests')">Test Center</button>
  </div>
  <h2>Giải thích đáp án</h2>
  ${ids.map((id,j)=>{
    const q=questions[id];
    return card(`Câu ${j+1}: ${safe(q.q)}`,
      `Đáp án: ${"ABCD"[q.a]}. ${safe(q.o[q.a])}<p>${safe(q.e)}</p>`);
  }).join("")}`;
}

function renderResults(){
  app.innerHTML=`
  <h2>📊 Kết quả học tập</h2>
  <button class="btn alt" onclick="go('home')">← Trang chủ</button>
  <div class="card">
  ${db.results.length?`
  <table>
    <tr><th>Hoạt động</th><th>Điểm</th><th>Ngày</th></tr>
    ${db.results.slice().reverse().map(r=>`
      <tr>
      <td>${safe(r.type)}</td>
      <td>${safe(r.score)}/10</td>
      <td>${safe(r.date)}</td>
      </tr>`).join("")}
  </table>`:"Chưa có kết quả."}
  </div>
  <h2>📋 Bài được giao</h2>
  <div class="card">
    ${db.assignments.length?
      db.assignments.map(a=>`
      <p>${safe(a.name)} – Hạn: ${safe(a.deadline||"Chưa đặt")}
      <button class="btn" onclick="startTest(${Number(a.test)===2?2:1})">
      Làm bài</button></p>`).join(""):
      "Chưa có bài được giao."}
  </div>`;
}

function renderTeacher(){
  const count=db.results.length;
  const avg=count?
    (db.results.reduce((s,r)=>s+r.score,0)/count).toFixed(1):"—";

  app.innerHTML=`
  <div class="hero">
    <h2>👩‍🏫 Teacher Studio</h2>
    <p>Không gian quản lý học tập – phiên bản demo</p>
  </div>
  <div class="grid">
    ${card("Lượt hoàn thành",`<h2>${count}</h2>`)}
    ${card("Điểm trung bình",`<h2>${avg}/10</h2>`)}
    ${card("Bài đã giao",`<h2>${db.assignments.length}</h2>`)}
  </div>
  <h2>📋 Giao bài</h2>
  <div class="card">
    <label>Tên bài giao</label>
    <input id="assignName" value="Unit 1 – Test 01">
    <label>Chọn đề</label>
    <select id="assignTest">
      <option value="1">Test 01</option>
      <option value="2">Test 02</option>
    </select>
    <label>Hạn nộp</label>
    <input id="assignDate" type="date">
    <button class="btn" onclick="addAssignment()">+ Giao bài</button>
    <p class="muted">Bài giao chỉ lưu trên trình duyệt này.</p>
  </div>
  <h2>📊 Kết quả học sinh demo</h2>
  <div class="card">
    ${db.results.length?`
      <table>
      <tr><th>Hoạt động</th><th>Điểm</th><th>Ngày</th></tr>
      ${db.results.slice().reverse().map(r=>`
        <tr><td>${safe(r.type)}</td>
        <td>${safe(r.score)}/10</td>
        <td>${safe(r.date)}</td></tr>`).join("")}
      </table>`:"Chưa có dữ liệu."}
    <button class="btn alt" onclick="exportCSV()">⬇ Xuất CSV</button>
  </div>
  <h2>Danh sách bài đã giao</h2>
  <div class="card">
    ${db.assignments.length?
      db.assignments.map(a=>`
        <p>📝 ${safe(a.name)} – Test ${safe(a.test)}
        – Hạn ${safe(a.deadline||"Chưa đặt")}</p>
      `).join(""):"Chưa có bài giao."}
  </div>`;
}

function addAssignment(){
  const name=document.getElementById("assignName").value.trim();
  const test=Number(document.getElementById("assignTest").value);
  const deadline=document.getElementById("assignDate").value;

  if(!name){
    alert("Vui lòng nhập tên bài.");
    return;
  }

  db.assignments.push({name,test,deadline});
  save();
  renderTeacher();
  alert("Đã giao bài trong phiên bản demo!");
}

function exportCSV(){
  const rows=[
    ["Hoạt động","Điểm / 10","Ngày"],
    ...db.results.map(r=>[r.type,r.score,r.date])
  ];

  const csv="\uFEFF"+rows.map(row=>
    row.map(value=>'"'+String(value).replace(/"/g,'""')+'"').join(",")
  ).join("\r\n");

  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download="English11_Results.csv";
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

render();
</script>
</body>
</html>
